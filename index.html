<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Zombie Escape</title>
<style>
  body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
  canvas { display:block; background:#333; }
  #overlay { position:absolute; top:0; left:0; width:100%; height:100%; 
             background:rgba(0,0,0,0.8); display:flex; flex-direction:column; 
             justify-content:center; align-items:center; color:white; z-index:10;}
  #overlay h1 { font-size:48px; margin:0; }
  #overlay p { margin:10px 0 30px 0; }
  #overlay button { padding:10px 20px; margin:5px; font-size:18px; border-radius:10px; cursor:pointer; border:none; background:#e63946; color:white; }
</style>
</head>
<body>

<div id="overlay">
  <h1>Zombie Escape 2D</h1>
  <p>This game developed by Abdou Zeraoulia</p>
  <div id="start-screen">
    <button onclick="showCharacterSelection()">Start</button>
  </div>
  <div id="char-selection" style="display:none;">
    <p>Choose your character</p>
    <button onclick="selectPlayer(0)"><img src="assets/images/player1.png" width="50"> Green</button>
    <button onclick="selectPlayer(1)"><img src="assets/images/player2.png" width="50"> Blue</button>
    <button onclick="selectPlayer(2)"><img src="assets/images/player3.png" width="50"> Yellow</button>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
let canvas = document.getElementById('gameCanvas');
let ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let overlay = document.getElementById('overlay');
let charSelection = document.getElementById('char-selection');

let playerImg = new Image();
let zombieImg = new Image();
let backgroundImg = new Image();
backgroundImg.src = 'assets/images/background.png';

let walkSound = new Audio('assets/sounds/walk.mp3');
let zombieSound = new Audio('assets/sounds/zombie.mp3');
let gameOverSound = new Audio('assets/sounds/gameover.mp3');

let player = {x:100, y:100, width:50, height:50, speed:5};
let zombies = [
  {x:300, y:300, width:50, height:50, speed:2},
  {x:500, y:200, width:50, height:50, speed:2}
];

let keys = {};

// ---- اختيار الشخصية ----
function showCharacterSelection(){
  document.getElementById('start-screen').style.display='none';
  charSelection.style.display='block';
}

function selectPlayer(index){
  let imgs = ['assets/images/player1.png','assets/images/player2.png','assets/images/player3.png'];
  playerImg.src = imgs[index];
  zombieImg.src = 'assets/images/zombie.png';
  overlay.style.display='none';
  gameLoop();
}

// ---- التحكم ----
window.addEventListener('keydown', e=>{ keys[e.key]=true; });
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

// ---- الاصطدام ----
function isColliding(a,b){
  return !(
    a.x+a.width < b.x ||
    a.x > b.x+b.width ||
    a.y+a.height < b.y ||
    a.y > b.y+b.height
  );
}

// ---- اللعبة ----
function gameLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // خلفية
  ctx.drawImage(backgroundImg,0,0,canvas.width,canvas.height);

  // حركة اللاعب
  let moved=false;
  if(keys['ArrowUp'] || keys['w']) { player.y -= player.speed; moved=true; }
  if(keys['ArrowDown'] || keys['s']) { player.y += player.speed; moved=true; }
  if(keys['ArrowLeft'] || keys['a']) { player.x -= player.speed; moved=true; }
  if(keys['ArrowRight'] || keys['d']) { player.x += player.speed; moved=true; }

  // حدود الشاشة
  player.x = Math.max(0, Math.min(canvas.width-player.width, player.x));
  player.y = Math.max(0, Math.min(canvas.height-player.height, player.y));

  if(moved){ walkSound.currentTime=0; walkSound.play(); }

  // رسم اللاعب
  ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

  // حركة الزومبي
  zombies.forEach(z=>{
    let dx = player.x - z.x;
    let dy = player.y - z.y;
    let dist = Math.sqrt(dx*dx+dy*dy);
    z.x += (dx/dist)*z.speed;
    z.y += (dy/dist)*z.speed;

    ctx.drawImage(zombieImg, z.x, z.y, z.width, z.height);

    if(dist<player.width){
      gameOver();
    }
  });

  requestAnimationFrame(gameLoop);
}

function gameOver(){
  gameOverSound.play();
  alert("Game Over!");
  location.reload();
}
</script>

</body>
</html>
